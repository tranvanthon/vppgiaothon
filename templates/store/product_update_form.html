{% extends 'base.html' %}
{% block content %}
  <div class="container d-flex justify-content-center mt-3">
    <div class="shadow p-3 py-4">
      <h2 class="mt-3 text-center text-primary">{{ title }}</h2>
      <div class="p-3">
        <form action="{% url 'store:product_update' object.slug %}" method="post" enctype="multipart/form-data">
          {% csrf_token %}
          {{ form.as_p }}
          <div id="image-list" class="d-flex justify-content-between align-items-center">
            {% for img in product.images.all %}
              <div class="position-relative" class="image-item" data-id="{{ img.id }}">
                <img src="{{ img.image.url }}" width="100" />
                {% comment %} <a class="position-absolute end-0 top-0" href="{% url 'delete-product-image' img.pk %}">❌</a> {% endcomment %}
                <!-- main -->
                <div>
                  {% if img.is_main %}
                    ⭐ Main
                  {% else %}
                    <a href="{% url 'store:set-main-image' img.pk %}">Set Main</a>
                  {% endif %}
                </div>
              </div>
            {% endfor %}
          </div>
          <br />
          <input type="file" name="images" multiple />

          <div class="d-flex justify-content-between align-items-center mt-5">
            <a class="btn btn-info rounded-pill col-4 me-2" href="">Cencel</a>
            <input class="btn btn-success rounded-pill col-5" type="submit" value="{{ title }}" />
          </div>
        </form>
      </div>
    </div>
  </div>
{% endblock %}
