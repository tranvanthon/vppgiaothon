{% extends 'base.html' %}
{% block navbar %}
  {% include 'partials/navbar.html' %}
{% endblock %}

{% block content %}
  <div class="container d-flex justify-content-center mt-3">
    <div class="shadow p-3 py-4">
      <h2 class="mt-3 text-center text-primary">{{ title }}</h2>
      <div class="p-3">
        <form method="post" enctype="multipart/form-data">
          {% csrf_token %}
          {{ form.as_p }}
          <div class="d-flex justify-content-between align-items-center mt-5">
            <a class="btn btn-info rounded-pill col-3 me-2" href="{% url 'store:home' %}">Cencel</a>
            <input class="btn btn-success rounded-pill col-4" type="submit" value="{{ title }}" />
          </div>
        </form>
      </div>
    </div>
  </div>
{% endblock %}
